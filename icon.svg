<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#131b2e"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#2a3756" stroke-width="8"/>

  <!-- 4 Selected Tiles summing to 10: 1 + 2 + 3 + 4 = 10 -->
  <!-- Selection Bounding Box -->
  <rect x="80" y="80" width="352" height="352" rx="36" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="8" stroke-dasharray="16 10"/>

  <!-- Tile (1,1): 1 -->
  <rect x="104" y="104" width="140" height="140" rx="24" fill="#1e2942" stroke="#334155" stroke-width="4"/>
  <text x="174" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#f8fafc" text-anchor="middle">1</text>

  <!-- Tile (1,2): 2 -->
  <rect x="268" y="104" width="140" height="140" rx="24" fill="#1e2942" stroke="#334155" stroke-width="4"/>
  <text x="338" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#f8fafc" text-anchor="middle">2</text>

  <!-- Tile (2,1): 3 -->
  <rect x="104" y="268" width="140" height="140" rx="24" fill="#1e2942" stroke="#334155" stroke-width="4"/>
  <text x="174" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#f8fafc" text-anchor="middle">3</text>

  <!-- Tile (2,2): 4 -->
  <rect x="268" y="268" width="140" height="140" rx="24" fill="#1e2942" stroke="#334155" stroke-width="4"/>
  <text x="338" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#f8fafc" text-anchor="middle">4</text>

  <!-- Floating Badge: = 10 -->
  <rect x="166" y="420" width="180" height="56" rx="28" fill="url(#glowGrad)" filter="drop-shadow(0 8px 16px rgba(245, 158, 11, 0.4))"/>
  <text x="256" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#0f172a" text-anchor="middle">= 10</text>
</svg>
